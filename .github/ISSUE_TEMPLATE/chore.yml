name: Chore
description: Tooling, dependencies, infrastructure, refactoring or docs — no user-facing change
title: "chore(<area>): "
labels: ["type/chore"]
body:
  - type: textarea
    id: what
    attributes:
      label: What and why
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      placeholder: |
        - [ ] …
    validations:
      required: true
