name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Markdown and docs/ don't reach the app, and Prettier skips *.md, so a
  # change to only those skips checks and e2e (#215). A job skipped by its
  # `if:` counts as passing for branch protection; `paths-ignore` would leave
  # the required checks pending instead. Anything else, or a diff that can't
  # be computed, runs everything.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Changed files
        id: diff
        env:
          # A PR is checked out as its merge commit: HEAD^1 is the base.
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: |
          code=true
          if files=$(git diff --name-only "$BASE" HEAD) && [ -n "$files" ]; then
            code=false
            while IFS= read -r file; do
              case "$file" in
                *.md | docs/* | .github/ISSUE_TEMPLATE/* | LICENSE) ;;
                *) code=true ;;
              esac
            done <<< "$files"
          fi
          echo "$files"
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  checks:
    name: checks
    needs: changes
    # Runs unless `changes` said docs only, also when `changes` failed.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  # Database tests and Playwright against the local Supabase stack, seeded by
  # supabase/seed.sql. Never against a preview or production (D-010).
  e2e:
    name: e2e
    needs: changes
    # Runs unless `changes` said docs only, also when `changes` failed.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # The CLI pulls from public.ecr.aws by default, which rate-limits the
      # runners (toomanyrequests on every run, up to 26 s of retries before
      # it falls back to ghcr.io anyway). Pull from ghcr.io directly (#136).
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Not cached: the Supabase images (~700 MB compressed) took 70–95 s to
      # restore and docker load, against ~42 s to pull them; the Playwright
      # browser saved ~1 s, as its system dependencies install either way.
      # Measured in #136.
      - name: Start Supabase
        # Same services as locally: db:start leaves out what the tests don't use.
        run: npm run db:start

      - name: Database tests
        run: npm run db:test

      - name: Install Playwright browser
        # The tests run headless, so the headless shell is all they need.
        run: npx playwright install --with-deps --only-shell chromium

      - name: Cache Next build
        # Turbopack's build cache: compiling drops from ~8 s to under 1 s.
        uses: actions/cache@v4
        with:
          path: .next/cache
          # Separate from a Vercel build: the e2e build inlines the local
          # Supabase values. A source change falls back to the newest cache.
          key: next-e2e-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'public/**', '*.ts', '*.mjs', '*.json') }}
          restore-keys: |
            next-e2e-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Playwright
        # Builds the app with the local Supabase values and starts it on :3100.
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
