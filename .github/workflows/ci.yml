name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  # Database tests and Playwright against the local Supabase stack, seeded by
  # supabase/seed.sql. Never against a preview or production (D-010).
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # The CLI pulls from public.ecr.aws by default, which rate-limits the
      # runners (toomanyrequests on every run, up to 26 s of retries before
      # it falls back to ghcr.io anyway). Pull from ghcr.io directly (#136).
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Cache Supabase images
        id: supabase-images
        uses: actions/cache@v4
        with:
          path: ~/supabase-images.tar
          # The CLI version pins the image versions.
          key: supabase-images-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Load Supabase images
        if: steps.supabase-images.outputs.cache-hit == 'true'
        run: docker load -i ~/supabase-images.tar

      - name: Start Supabase
        # Same services as locally: db:start leaves out what the tests don't use.
        run: npm run db:start

      - name: Database tests
        run: npm run db:test

      - name: Save Supabase images
        # After db:test, so the pg_prove image is in it too.
        if: steps.supabase-images.outputs.cache-hit != 'true'
        run: docker save -o ~/supabase-images.tar $(docker images --format '{{.Repository}}:{{.Tag}}' | grep '^ghcr.io/supabase/')

      - name: Playwright version
        id: playwright
        run: echo "version=$(npx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browser
        # The tests run headless, so the headless shell is all they need.
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Cache Next build
        uses: actions/cache@v4
        with:
          path: .next/cache
          # Separate from a Vercel build: the e2e build inlines the local
          # Supabase values. A source change falls back to the newest cache.
          key: next-e2e-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'public/**', '*.ts', '*.mjs', '*.json') }}
          restore-keys: |
            next-e2e-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Playwright
        # Builds the app with the local Supabase values and starts it on :3100.
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
